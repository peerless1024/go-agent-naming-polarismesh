name: License checker

on:
  push:
    branches:
      - main
      - "feat/**"
      - "release/*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
      - "feat/**"
      - "release/*"
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  check-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check license headers
        uses: apache/skywalking-eyes@v0.4.0
